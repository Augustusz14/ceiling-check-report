<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>天花設備檢核報告</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#cbd5e1;--acc:#1d4ed8;--err:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--ink:#e2e8f0;--mut:#94a3b8;--line:#334155;--acc:#3b82f6;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:18px;margin:0 0 2px}
.m{color:var(--mut);font-size:13px;margin:0 0 16px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--mut)}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
progress{width:100%;height:6px;margin-top:12px;display:none}
#s{min-height:20px;margin-top:10px;font-size:13px;color:var(--mut)}
#s.e{color:var(--err)}
</style>
</head>
<body>
<form id="f">
<h1>天花設備檢核報告</h1>
<p class="m" id="t">&nbsp;</p>
<input type="password" id="p" placeholder="請輸入密碼" autocomplete="current-password" required autofocus>
<label><input type="checkbox" id="k" checked> 在此裝置記住密碼</label>
<button id="b">開啟報告</button>
<progress id="g" max="1" value="0"></progress>
<div id="s" role="status"></div>
</form>
<script>
(function(){
var SALT='779e8394ab2991f316f5f1ea323d980c',ITER=600000,RK='rk_'+SALT.slice(0,8),V=null;
var $=function(i){return document.getElementById(i)};
function hex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function msg(t,e){$('s').textContent=t;$('s').className=e?'e':''}
function busy(on){$('b').disabled=on;$('p').disabled=on}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function bin(p){var r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return new Uint8Array(await r.arrayBuffer())}
function dec(key,c){return crypto.subtle.decrypt({name:'AES-GCM',iv:c.subarray(0,12)},key,c.subarray(12))}
async function version(){
  if(!V){var r=await fetch('v.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('v.json '+r.status);V=await r.json();$('t').textContent='最後更新：'+V.t}
  return V;
}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:hex(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function open(key,remember){
  busy(true);msg('驗證中…');
  try{
    var v=await version(),plain;
    var d=await bin('d/'+v.d+'.bin');
    try{plain=await dec(key,d)}catch(e){store(RK,null);busy(false);msg('密碼錯誤',1);$('p').value='';$('p').focus();return}
    if(remember)store(RK,b64(new Uint8Array(await crypto.subtle.exportKey('raw',key))));
    var html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    var re=/@@E_([0-9a-f]{24})_([a-z+]+)@@/g,need={},m;
    while((m=re.exec(html)))need[m[1]]=m[2];
    var ids=Object.keys(need),url={},done=0,g=$('g');
    g.max=ids.length||1;g.value=0;g.style.display='block';msg('載入圖片 0 / '+ids.length);
    async function worker(){
      while(ids.length){var n=ids.shift(),c=await bin('a/'+n+'.bin'),p=await dec(key,c);
        url[n]=URL.createObjectURL(new Blob([p],{type:'image/'+need[n]}));
        g.value=++done;msg('載入圖片 '+done+' / '+g.max)}
    }
    await Promise.all([1,2,3,4,5,6].map(worker));
    html=html.replace(re,function(_,n){return url[n]});
    document.open();document.write(html);document.close();
  }catch(e){busy(false);msg('載入失敗：'+(e&&e.message||e)+'（請重新整理再試）',1)}
}
$('f').addEventListener('submit',async function(ev){
  ev.preventDefault();busy(true);msg('驗證中…');
  try{open(await derive($('p').value),$('k').checked)}catch(e){busy(false);msg('載入失敗：'+(e&&e.message||e),1)}
});
if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){busy(true);msg('此瀏覽器不支援，請使用最新版 Chrome／Edge／Safari',1);return}
version().catch(function(){});
var hk=/[#&]k=([^&]+)/.exec(location.hash),saved=load(RK);
if(hk){$('p').value=decodeURIComponent(hk[1]);derive($('p').value).then(function(k){open(k,true)},function(e){msg('載入失敗：'+(e&&e.message||e),1)})}
else if(saved)crypto.subtle.importKey('raw',unb64(saved),'AES-GCM',true,['decrypt']).then(function(k){open(k,false)},function(){store(RK,null)});
})();
</script>
</body>
</html>
